<Input edr_log>
	Module		im_file
	File		"C:\\path\\to\\spiEDR\\logs\\spiedr.log"
	Exec $SourceName = 'spiEDR';
	SavePos		TRUE
	ReadFromLast	TRUE
</Input>

<Input dlp_log>
	Module		im_file
	File		"C:\\path\\to\\delpy\\logs\\delpy.log"
	Exec $SourceName = 'delpy';
	SavePos		TRUE
	ReadFromLast	TRUE
</Input>

<Input waf_log>
	Module		im_file
	File		"C:\\path\\to\\bunnywaf\\logs\\bunnywaf.log"
	Exec $SourceName = 'BunnyWAF';
	SavePos		TRUE
	ReadFromLast	TRUE
</Input>

<Input id_log>
	Module		im_file
	File		"C:\\path\\to\\sentraID\\logs\\sentraid.log"
	Exec $SourceName = 'sentraID';
	SavePos		TRUE
	ReadFromLast	TRUE
</Input>

<Output remote_syslog>
	Module		om_tcp
	Host		<SYSLOG_HOST>
	Port		514
	Exec		to_syslog_bsd();
</Output>

<Route to_syslog>
	Path		edr_log, dlp_log, waf_log, id_log => remote_syslog
</Route>
